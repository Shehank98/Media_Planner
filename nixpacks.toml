# Railway builds with Nixpacks. This is a pure-Python (FastAPI) app; matplotlib
# needs a writable font cache at runtime.

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --no-cache-dir -r backend/requirements.txt",
]

[start]
cmd = "/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"

[variables]
MPLCONFIGDIR = "/tmp/matplotlib"
DATA_DIR = "/tmp/media-planner-data"
PYTHONUNBUFFERED = "1"
